name: GameCube hardware bridge validation
on:
  pull_request:
    paths: ['tools/gamecube_bridge/**', 'VideoMode/**', '.github/workflows/hardware-bridge.yml', 'global.json', 'Directory.Build.props']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bridge:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/checkout@v4
        if: runner.os == 'Linux'
        with:
          repository: capz/DolphinDotNet.Debuggers
          ref: 6ea774fdf377324e587ee19b48ebc426207bb001
          path: out/launcher-source
      - name: Build the production C wire-protocol fixture (never executes an ELF)
        if: runner.os == 'Linux'
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -Iout/launcher-source/tools/DolphinDotNet.Launcher \
            out/launcher-source/tools/DolphinDotNet.Launcher/tests/stdio_receiver.c \
            out/launcher-source/tools/DolphinDotNet.Launcher/elf.c \
            out/launcher-source/tools/DolphinDotNet.Launcher/protocol.c \
            out/launcher-source/tools/DolphinDotNet.Launcher/zlib_decode.c \
            out/launcher-source/tools/DolphinDotNet.Launcher/puff.c -o "$RUNNER_TEMP/dnd-stdio-receiver"
          echo "DND_LAUNCHER_STDIO_FIXTURE=$RUNNER_TEMP/dnd-stdio-receiver" >> "$GITHUB_ENV"
      - name: Test authenticated API, launcher wire protocol and telemetry
        run: python -m unittest discover -s tools/gamecube_bridge/tests -v
      - name: Parse Windows provisioning scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem tools/gamecube_bridge/*.ps1 | ForEach-Object {
            $tokens = $null; $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count) { throw ($parseErrors | Out-String) }
          }
      - name: Validate private Windows setup without contacting a console
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP 'dnd-bridge-setup-test'
          New-Item -ItemType Directory -Path $env:LOCALAPPDATA -Force | Out-Null
          ./tools/gamecube_bridge/Setup-Windows.ps1 -ConsoleAddress 192.168.1.80
          $configRoot = Join-Path $env:LOCALAPPDATA 'DolphinDotNet/HardwareBridge'
          $tokenValue = [IO.File]::ReadAllText((Join-Path $configRoot 'api-token.txt'))
          if ($tokenValue.Length -ne 64) { throw 'Invalid generated API credential length' }
          $settings = Get-Content (Join-Path $configRoot 'config.json') -Raw | ConvertFrom-Json
          if ($settings.target_kind -ne 'gamecube' -or $settings.api_port -ne 6280) { throw 'Invalid generated configuration' }
          # Credential values are never printed.
  native-reporting-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile optimized native callback variants (no hardware contact)
        env:
          IplRunnerHost: 10.0.2.2
          IplRunnerToken: 0123456789abcdef0123456789abcdef
        run: |
          set -euo pipefail
          dotnet build VideoMode/VideoMode.csproj -c Release -p:DndBuildNative=true -p:DndBuildBackend=Docker -p:IplHardwareRunner=true -p:DndDebugSymbols=false -p:DndGdbTransport=Off
          python3 -c 'import sys,pathlib;sys.path.insert(0,"tools/gamecube_bridge");import client,protocol;client.optimized(pathlib.Path("VideoMode/obj/Release/net8.0/native/Makefile"));protocol.compact_elf(pathlib.Path("VideoMode/bin/Release/net8.0/VideoMode.elf").read_bytes(),"0123456789abcdef0123456789abcdef")'
          dotnet build VideoMode/VideoMode.csproj -c Release -p:DndBuildNative=true -p:DndBuildBackend=Docker -p:IplHardwareRunner=true -p:IplRunnerScene=Detail -p:IplRunnerVideo=576p -p:DndDebugSymbols=false -p:DndGdbTransport=Off
          python3 ci/verify_aot.py VideoMode --generated-c VideoMode/obj/Release/net8.0/native/source/generated_program.c
      - name: Compile current hardware instrumentation with the historical renderer
        env:
          IplRunnerHost: 10.0.2.2
          IplRunnerToken: 0123456789abcdef0123456789abcdef
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 0178139832d5c34a032d17a950ab9de0894b7171
          git show 0178139832d5c34a032d17a950ab9de0894b7171:VideoMode/IplRenderer.cs > VideoMode/IplRenderer.cs
          git show 0178139832d5c34a032d17a950ab9de0894b7171:VideoMode/GameCubeCanvas.cs > VideoMode/GameCubeCanvas.cs
          dotnet build VideoMode/VideoMode.csproj -c Release -p:DndBuildNative=false -p:IplHistoricalRenderer=true -p:IplHardwareRunner=true -p:DndDebugSymbols=false -p:DndGdbTransport=Off
